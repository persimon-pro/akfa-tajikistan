server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Favicon and app icons: fallback to root if not found in subdir
    location ~* (^|/)favicon\.(ico|png)$ {
        try_files $uri /favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location ~* (apple-touch-icon|android-chrome).*\.png$ {
        try_files $uri /apple-touch-icon.png;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Media caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
